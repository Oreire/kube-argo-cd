apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-rules
  namespace: monitoring
spec:
  groups:
    - name: alerts
      rules:
        - alert: HighCPUUsage
          expr: sum by(instance) (rate(node_cpu_seconds_total{mode!="idle"}[5m])) > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High CPU usage detected"
            description: "CPU utilization exceeded 80% for more than 5 minutes"

        - alert: HighMemoryUsage
          expr: node_memory_MemAvailable_bytes < 1e9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High memory usage detected"
            description: "Available memory dropped below 1GB for more than 5 minutes"

        - alert: WebAppHighLatency
          expr: (sum(rate(http_request_duration_seconds_sum[5m])) / sum(rate(http_request_duration_seconds_count[5m]))) > 0.5
