global:
  resolve_timeout: 5m # ✅ Ensures alerts auto-resolve after 5 minutes

route:
  group_by: ["alertname", "severity"] # ✅ Groups alerts to avoid duplicate notifications
  receiver: "slack-alerts"
  routes:
    - match:
        severity: critical
      receiver: "email-alerts"

receivers:
  - name: "email-alerts"
