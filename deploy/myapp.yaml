apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebapp
  namespace: default
  labels:
    app: myapp
spec:
  replicas: 8  # ✅ Increased replicas for better load handling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2  # ✅ Allows for 2 extra pods during updates
      maxUnavailable: 1  # ✅ Ensures at least 7 pods are always available
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp-container
          image: ghs-nginx-app42:latest  # ✅ Ensure correct registry path
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
